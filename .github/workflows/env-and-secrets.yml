name: Environment Variables and Secrets Workflow

on:
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ENVIRONMENT: production

jobs:
  deploy-to-aws:
    runs-on: ubuntu-latest
    env:
      DEPLOYMENT_NAME: production-release

    steps:
      - name: Print workflow-level variables
        run: |
          echo "AWS_REGION=$AWS_REGION"
          echo "ENVIRONMENT=$ENVIRONMENT"

      - name: Print job-level variable
        run: |
          echo "DEPLOYMENT_NAME=$DEPLOYMENT_NAME"
          echo "Workflow variables are still available here: $AWS_REGION / $ENVIRONMENT"

      - name: Access repository secrets
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          echo "AWS Access Key ID: $AWS_ACCESS_KEY_ID"
          echo "AWS Secret Access Key: $AWS_SECRET_ACCESS_KEY"
          echo "If secrets are configured correctly, GitHub will mask them in the logs."

      - name: Demonstrate step-level variable
        env:
          STEP_MESSAGE: step-level variables only exist in this step
        run: |
          echo "STEP_MESSAGE=$STEP_MESSAGE"
          echo "DEPLOYMENT_NAME=$DEPLOYMENT_NAME"
          echo "ENVIRONMENT=$ENVIRONMENT"

      - name: Show scope after previous step
        run: |
          echo "STEP_MESSAGE is now: ${STEP_MESSAGE:-not set}"
          echo "DEPLOYMENT_NAME still exists: $DEPLOYMENT_NAME"
          echo "AWS_REGION still exists: $AWS_REGION"